name: Backend — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'Backend/Silvee-Backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:     # allow manual trigger from GitHub UI

env:
  AWS_REGION:       ap-south-1
  ECR_REPO_NAME:    littleloot-backend
  APP_RUNNER_ARN:   ${{ secrets.APP_RUNNER_SERVICE_ARN }}

jobs:
  test:
    name: Lint & basic checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Silvee-Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for syntax errors
        run: python -m py_compile app/main.py

      # Import the whole app with production dependencies: catches start-up
      # crashes (e.g. the Oct 30 NameError) BEFORE they reach App Runner.
      - name: App boots (import + route registration)
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          CLOUDINARY_CLOUD_NAME: ci
          CLOUDINARY_API_KEY: ci
          CLOUDINARY_API_SECRET: ci
          SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
          RAZORPAY_KEY_ID: ci
          RAZORPAY_KEY_SECRET: ci
          RAZORPAY_WEBHOOK_SECRET: ci
        run: |
          python -c "import app.main as m; n=len(m.server.openapi()['paths']); print(f'app imported, {n} routes')"

      # alembic_version.version_num is VARCHAR(32): a longer revision id makes the
      # migration fail at boot (the Nov 2 outage cause).
      - name: Alembic revision ids fit VARCHAR(32)
        run: |
          python - <<'EOF'
          import glob, re, sys
          bad = []
          for f in glob.glob('alembic/versions/*.py'):
              m = re.search(r"^revision(?::\s*str)?\s*=\s*['\"]([^'\"]+)['\"]", open(f, encoding='utf-8').read(), re.M)
              if m and len(m.group(1)) > 32:
                  bad.append(f"{m.group(1)} ({len(m.group(1))} chars) in {f}")
          if bad:
              print("Revision ids longer than 32 characters:\n  " + "\n  ".join(bad)); sys.exit(1)
          print("all revision ids <= 32 chars")
          EOF

      - name: Ruff lint (if installed)
        run: |
          pip install ruff --quiet || true
          ruff check app/ --select E,F --ignore F401 || true

  build-and-deploy:
    name: Build image → ECR → App Runner
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write    # needed for OIDC authentication to AWS
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_NAME }}"
          echo "image_sha=${IMAGE}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE}:latest"    >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        working-directory: Backend/Silvee-Backend
        run: |
          docker build \
            --file Dockerfile \
            --tag "${{ steps.meta.outputs.image_sha }}" \
            --tag "${{ steps.meta.outputs.image_latest }}" \
            .

      - name: Push to ECR
        run: |
          docker push "${{ steps.meta.outputs.image_sha }}"
          docker push "${{ steps.meta.outputs.image_latest }}"

      - name: Trigger App Runner deployment
        id: deploy
        run: |
          OP_ID=$(aws apprunner start-deployment \
            --service-arn "${{ env.APP_RUNNER_ARN }}" \
            --query 'OperationId' --output text)
          echo "operation_id=${OP_ID}" >> "$GITHUB_OUTPUT"
          echo "Started deployment operation ${OP_ID}"

      # Track THIS deployment's operation: the service status reads RUNNING even
      # after App Runner rolls a failed deployment back, which used to pass here.
      - name: Wait for deployment to complete
        run: |
          OP_ID="${{ steps.deploy.outputs.operation_id }}"
          echo "Waiting for operation ${OP_ID} (up to 15 min)..."
          for i in $(seq 1 90); do
            OP_STATUS=$(aws apprunner list-operations \
              --service-arn "${{ env.APP_RUNNER_ARN }}" \
              --query "OperationSummaryList[?Id=='${OP_ID}'].Status | [0]" --output text)
            echo "  [${i}/90] Operation status: ${OP_STATUS}"
            case "$OP_STATUS" in
              SUCCEEDED) echo "Deployment succeeded!"; exit 0 ;;
              FAILED|ROLLBACK_SUCCEEDED|ROLLBACK_FAILED|ROLLBACK_IN_PROGRESS)
                echo "::error::Deployment did not go live (${OP_STATUS}). App Runner kept/rolled back the previous version - check the application logs in CloudWatch."
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for deployment"
          exit 1

      - name: Smoke test — health check
        run: |
          SERVICE_URL=$(aws apprunner describe-service \
            --service-arn "${{ env.APP_RUNNER_ARN }}" \
            --query 'Service.ServiceUrl' --output text)
          echo "Hitting https://${SERVICE_URL}/healthz"
          HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://${SERVICE_URL}/healthz")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Health check passed (HTTP ${HTTP_STATUS})"
          else
            echo "Health check FAILED (HTTP ${HTTP_STATUS})"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Backend deployment failed. Check App Runner logs in CloudWatch."
